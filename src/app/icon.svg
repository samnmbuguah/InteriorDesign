<svg width="48" height="48" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#1C1917" />
      <stop offset="100%" stopColor="#0C0A09" />
    </linearGradient>
    <linearGradient id="goldScrew" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#FCD34D" />
      <stop offset="40%" stopColor="#F59E0B" />
      <stop offset="100%" stopColor="#B45309" />
    </linearGradient>
    <linearGradient id="steelChuck" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#E2E8F0" />
      <stop offset="100%" stopColor="#64748B" />
    </linearGradient>
  </defs>

  {/* Outer Rounded Workshop Disc */}
  <rect width="48" height="48" rx="12" fill="url(#bgGrad)" />
  <rect x="1.5" y="1.5" width="45" height="45" rx="10.5" stroke="#F59E0B" stroke-width="1.2" stroke-opacity="0.4" />

  {/* Precision Caliper Graduation Ticks */}
  <circle cx="24" cy="24" r="20" stroke="#FCD34D" stroke-width="0.8" stroke-dasharray="1.5 2.5" stroke-opacity="0.6" />

  {/* Drill Bit & Architectural Screw Assembly (Rotated 45 degrees) */}
  <g transform="rotate(45 24 24)">
    {/* Drill Chuck / Hex Driver Collar */}
    <rect x="20.5" y="7" width="7" height="6.5" rx="1.5" fill="url(#steelChuck)" stroke="#F59E0B" stroke-width="0.8" />
    <line x1="22.5" y1="8" x2="22.5" y2="12.5" stroke="#1E293B" stroke-width="0.8" />
    <line x1="24" y1="8" x2="24" y2="12.5" stroke="#1E293B" stroke-width="0.8" />
    <line x1="25.5" y1="8" x2="25.5" y2="12.5" stroke="#1E293B" stroke-width="0.8" />

    {/* Drill Bit Fluting */}
    <path d="M21.5 13.5 L26.5 13.5 L25.5 23 L22.5 23 Z" fill="url(#goldScrew)" />
    <path d="M21.5 15.5 Q24 17.5 26.5 19.5" stroke="#FFFBEB" stroke-width="1.2" stroke-linecap="round" />
    <path d="M21.5 19 Q24 21 26.5 23" stroke="#FFFBEB" stroke-width="1.2" stroke-linecap="round" />

    {/* Screw Thread Shank */}
    <path d="M22.5 23 L25.5 23 L24.6 33.5 L23.4 33.5 Z" fill="url(#goldScrew)" />
    {/* Razor Sharp Helical Threads */}
    <line x1="20" y1="25" x2="27" y2="24" stroke="#FEF3C7" stroke-width="1.3" stroke-linecap="round" />
    <line x1="20.5" y1="27.5" x2="26.5" y2="26.5" stroke="#FEF3C7" stroke-width="1.3" stroke-linecap="round" />
    <line x1="21" y1="30" x2="26" y2="29" stroke="#FEF3C7" stroke-width="1.3" stroke-linecap="round" />
    <line x1="22" y1="32.5" x2="25.5" y2="31.5" stroke="#FEF3C7" stroke-width="1.3" stroke-linecap="round" />

    {/* Gimlet Self-Tapping Tip */}
    <polygon points="23.4,33.5 24.6,33.5 24,38.5" fill="#FCD34D" />
  </g>

  {/* Concentric Center Torx Star Drive */}
  <circle cx="24" cy="24" r="3.2" fill="#0C0A09" stroke="#F59E0B" stroke-width="0.8" />
  <path d="M24 21.8 L24 26.2 M21.8 24 L26.2 24 M22.4 22.4 L25.6 25.6 M22.4 25.6 L25.6 22.4" stroke="#FCD34D" stroke-width="0.8" stroke-linecap="round" />

  {/* Sparkle Accent */}
  <circle cx="36" cy="12" r="1.5" fill="#FCD34D" />
</svg>

